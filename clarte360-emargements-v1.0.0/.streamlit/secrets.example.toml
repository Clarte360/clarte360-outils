# Copier en .streamlit/secrets.toml sur le VPS (ne jamais committer le vrai fichier de secrets)
[app]
base_url = "https://emargements.clarte360.com"
setup_key = "REMPLACER_PAR_UNE_CLE_LONGUE_ET_ALEATOIRE"
timezone = "Europe/Paris"

# V2.1 : convention prioritaire Clarte360. Le code accepte les cles sans tenir compte
# de la casse et conserve un fallback compatible avec l'ancien bloc [smtp].
[MAIL]
enabled = true
host = "REMPLACER_PAR_LE_SERVEUR_MAIL_EXISTANT"
port = 465
security = "ssl" # ssl | starttls | none
username = "REMPLACER"
password = "REMPLACER"
from_email = "REMPLACER"
from_name = "Clarté360"

[database]
url = "sqlite:///data/clarte360_emargements.db"

[security]
# Cle longue aleatoire dediee a la protection reversible des codes personnels.
# En production, conserver uniquement dans /opt/clarte360/secrets/secrets.toml
participant_pin_key = "REMPLACER_PAR_UNE_CLE_LONGUE_ET_ALEATOIRE"

# V3 I7 — Microsoft Graph / Teams
# Production: these values stay only in /opt/clarte360/secrets/secrets.toml.
# The private certificate file itself must NEVER be committed to Git.
[microsoft_graph]
enabled = false
tenant_id = "REMPLACER_PAR_TENANT_ID"
client_id = "REMPLACER_PAR_APPLICATION_CLIENT_ID"
organizer_user_id = "REMPLACER_PAR_OBJECT_ID_DE_TEAMS_CLARTE360"
organizer_upn = "teams@clarte360.com"
certificate_path = "/opt/clarte360/secrets/clarte360-graph-private.pem"
certificate_thumbprint = "REMPLACER_PAR_THUMBPRINT_CERTIFICAT"
guest_invites_enabled = false
stable_link_mode = true
request_timeout_seconds = 30

# Secret HMAC commun au Hub I9 et aux outils EXTERNAL_SIGNED (hors PIP spécialisé).
[hub]
hmac_secret = "REMPLACER_PAR_UN_SECRET_LONG_ET_ALEATOIRE_D_AU_MOINS_32_CARACTERES"
