# EXEMPLE UNIQUEMENT - aucune valeur réelle dans Git/ZIP/OneDrive documentaire.
[COMPETENCES_PROJETS_CONNECTOR]
LAUNCH_SIGNING_KEY = ""
OUTBOX_PENDING_DIR = ""

[GESTION_ACTIONS_CONNECTOR]
# HTTPS origin exposed by the GDA reverse proxy, without a path suffix.
# The C&P client adds /api/cp/v1/... to this value.
API_BASE_URL = ""
TIMEOUT_SECONDS = 15
MAX_FILE_MB = 20

[security]
session_timeout_minutes = 60

[france_travail]
client_id = ""
client_secret = ""
# Non-secret authorization parameter: copy the exact ROME Métiers scope
# displayed for the subscribed application in the France Travail developer portal.
rome_scope = ""
# Scope distinct du produit ROME Fiches métiers, à relever dans l'application
# France Travail souscrite. Aucune valeur ne doit être copiée dans Git si réelle.
rome_fiches_metiers_scope = ""
# Optional overrides; retain the documented defaults unless the portal says otherwise.
# token_url = "https://entreprise.francetravail.fr/connexion/oauth2/access_token?realm=/partenaire"
# rome_base_url = "https://api.francetravail.io/partenaire/rome-metiers"

# Contrat IA déjà partagé par les applications Clarté360 :
# renseigner la clé uniquement dans le secrets.toml réel du VPS, jamais ici.
[openai]
api_key = ""
model = "gpt-5-mini"
