# Ne jamais committer le vrai secrets.toml.
# Sur le VPS Clarté360, utiliser le lien symbolique vers :
# /opt/clarte360/secrets/secrets.toml

[security]
# Mot de passe réservé au consultant qui conduit l'entretien.
# Laisser vide uniquement en développement local.
admin_password = ""
session_limit_minutes = 60

[database]
# En production VPS, utiliser de préférence un chemin persistant hors du dépôt Git.
# Exemple : /opt/clarte360/data/aps/clarte360_aps.db
path = ""
