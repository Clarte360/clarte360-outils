# NE JAMAIS COMMITTER LE VRAI secrets.toml.
# Streamlit Community Cloud : renseigner ces valeurs dans App > Settings > Secrets.
# VPS Clarte360 : lien symbolique vers /opt/clarte360/secrets/secrets.toml

[email]
